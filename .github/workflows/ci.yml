name: OpsBoard CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: python -m compileall backend

      - name: Run backend tests
        run: |
          cd backend
          python -m unittest test_app.py -v

      - name: Build backend Docker image
        run: docker build -t opsboard-backend:ci ./backend

  integration-tests:
    runs-on: ubuntu-latest

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: opsboard_test
      DB_USER: opsboard_test
      DB_PASSWORD: test-password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root-test-password
          MYSQL_DATABASE: opsboard_test
          MYSQL_USER: opsboard_test
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run MySQL integration tests
        run: |
          cd backend
          python -m unittest test_integration.py -v

  publish-image:
    needs:
      - backend-ci
      - integration-tests

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/wondwossenh9/opsboard-backend:${{ github.sha }}
            ghcr.io/wondwossenh9/opsboard-backend:latest
